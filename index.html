<!doctype html>
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trouvez la voiture faite pour vous : budget, carrosserie, énergie, performances, usage. Fiches techniques et photos libres." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Ma Voiture Idéale</title>
    <script>
      // Après une mise à jour du site, une page gardée en cache peut réclamer d'anciens fichiers
      // qui n'existent plus (page blanche). Dans ce cas : on rafraîchit le cache et on recharge, une fois.
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          try {
            if (sessionStorage.getItem("rechargement-auto")) return;
            sessionStorage.setItem("rechargement-auto", "1");
          } catch (x) {}
          fetch(location.href, { cache: "reload" }).finally(function () {
            location.reload();
          });
        },
        true,
      );
      // Filet de sécurité : si l'application n'a rien affiché au bout de 10 s, on le dit.
      setTimeout(function () {
        var r = document.getElementById("root");
        if (r && !r.hasChildNodes())
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:32rem;margin:6rem auto;padding:0 1rem;text-align:center">' +
            "<h1>Le site n'a pas pu se charger</h1><p>Une nouvelle version vient peut-être d'être publiée.</p>" +
            '<button onclick="location.reload()" style="margin-top:1rem;padding:.6rem 1.2rem;border-radius:.6rem;border:0;background:#d6360c;color:#fff;font-weight:700;cursor:pointer">Recharger la page</button></div>';
      }, 10000);
    </script>
    <script>
      // Applique le thème avant le rendu pour éviter un flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "sombre" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
