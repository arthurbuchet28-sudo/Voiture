name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrôle des fiches techniques
        run: npm run data:verifier
      - name: Tests
        run: npm test
      - name: Types et build
        run: npm run build
