# Déploiement sur GitHub Pages, lancé à la main (onglet Actions > « Déployer sur GitHub Pages »).
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (servi sous /<nom-du-dépôt>/)
        run: npm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      # Le site utilise des URL propres (/resultats, /modele/…) : 404.html renvoie vers l'application.
      - run: cp dist/index.html dist/404.html
      # Un navigateur peut garder l'ancienne page en cache (10 min sur GitHub Pages) : on republie aussi
      # les fichiers JS/CSS de la version actuellement en ligne pour que cette page continue de marcher.
      - name: Conserver les fichiers de la version précédente
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for f in $(curl -fsS "$SITE" | grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' | sort -u); do
            if [ ! -f "dist/$f" ]; then
              curl -fsS -o "dist/$f" "$SITE$f" && echo "conservé : $f" || rm -f "dist/$f"
            fi
          done
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
