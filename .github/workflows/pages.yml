# Déploiement sur GitHub Pages, lancé à la main (onglet Actions > « Déployer sur GitHub Pages »).
# Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (servi sous /<nom-du-dépôt>/)
        run: npm run build
        env:
          BASE_URL: /${{ github.event.repository.name }}/
      # Le site utilise des URL propres (/resultats, /modele/…) : 404.html renvoie vers l'application.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
